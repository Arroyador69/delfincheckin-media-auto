# Dolores de propietarios de alojamiento en España.
# spoken_hook: ~3 s orales (8-12 palabras). scripts: el cuerpo, un tema por vídeo.

pains:
  - id: domingo_dnis
    theme: tiempo
    money_angle: false
    hook: Otro domingo en el portátil
    spoken_hook: Otro domingo copiando DNIs. ¿Otra vez?
    scene: Propietario en casa un domingo por la mañana, portátil, papeles, cara de no haber salido.
    image_extra: Sunday morning, kitchen table, laptop, printed papers, coffee gone cold
    scripts:
      - >
        El huésped llega a las once y tú sin playa. Con Delfín Check-in el
        viajero rellena el parte antes y se envía solo al Ministerio. Tú
        recuperas el domingo. Empieza gratis en delfincheckin.com
      - >
        El Excel y el parte te comen el día. Delfín Check-in manda el enlace
        al huésped, él lo rellena en su idioma y el Ministerio lo recibe
        sin que copies nada. Este domingo, sal. Una propiedad gratis en
        delfincheckin.com

  - id: todos_los_dias
    theme: tiempo
    money_angle: false
    hook: No es un mal mes. Es todos los días
    spoken_hook: ¿Otra noche en el sofá copiando DNIs?
    scene: Propietario de noche en el sofá, móvil, check-in a destiempo.
    image_extra: late evening on the sofa with phone, tired host
    scripts:
      - >
        Un check-in, un DNI, un XML, otro huésped a las once. Delfín Check-in
        deja el formulario hecho antes de que lleguen. Tú sueltas el móvil.
        Empieza gratis, una propiedad, en delfincheckin.com
      - >
        Te comes el día en mensajes de Airbnb y en el parte. Con Delfín
        Check-in el viajero llega con los datos ya enviados al Ministerio.
        Tú gestionas el piso, no copias documentos. Empieza gratis en
        delfincheckin.com

  - id: no_entienden_mir
    theme: legal
    money_angle: false
    hook: Airbnb no te salva del Ministerio
    spoken_hook: Airbnb no envía el parte. Te toca a ti.
    scene: Propietario confundido mirando el portátil, notificación, ceño.
    image_extra: confused host looking at laptop screen, Spanish apartment
    scripts:
      - >
        Booking tampoco envía el parte. El Ministerio te lo pide a ti, por
        el RD novecientos treinta y tres. Delfín Check-in hace el check-in
        digital y el envío al MIR por dos euros al mes. Una propiedad gratis.
        delfincheckin.com
      - >
        El PV y el RH son los partes al Ministerio, obligatorios en el piso
        turístico. Delfín Check-in los arma y los manda. Tú no peleas con el
        SES. Entra en delfincheckin.com

  - id: huesped_noche
    theme: tiempo
    money_angle: false
    hook: El huésped llega a las once y no tienes el DNI
    spoken_hook: Llega a las once y no tienes el DNI.
    scene: Portero automático de noche, propietario en pijama con el teléfono.
    image_extra: night time apartment door, host in hoodie with phone
    scripts:
      - >
        Sin el parte. Sin ganas. Con Delfín Check-in lo rellenó ayer, en su
        idioma, desde el sofá. Tú abres, das la llave y punto. Empieza
        gratis en delfincheckin.com
      - >
        Basta de copiar un pasaporte a las tantas. El enlace de Delfín
        Check-in va en la plantilla de Airbnb. Cuando llega, el parte ya
        está enviado al Ministerio. Tú duermes. Una propiedad gratis en
        delfincheckin.com

  - id: dinero_comision
    theme: dinero
    money_angle: true
    hook: No es que no ganes. Es lo que se te escapa
    spoken_hook: No es que no ganes. Es lo que se te escapa.
    scene: Propietario mirando liquidación de Airbnb en el portátil, cara seria.
    image_extra: host looking at payout on laptop, Spanish kitchen, serious
    scripts:
      - >
        El huésped que vuelve por Airbnb te deja otra comisión. Con el
        microsite de Delfín Check-in le mandas el enlace y te paga en
        directo. Más margen. Plan Pro, veintinueve noventa y nueve.
        delfincheckin.com
      - >
        Cada reserva repetida en la plataforma es dinero que no entra.
        Delfín Check-in te da página propia, pago con tarjeta y el parte
        al Ministerio en el mismo sitio. Menos intermediario. Más neto.
        Mira los planes en delfincheckin.com

  - id: no_saben_que_pueden_mas
    theme: dinero
    money_angle: true
    hook: El panel es más que el parte
    spoken_hook: Si solo mandas el parte, te falta el dinero.
    scene: Propietario que solo usa una función, resto del producto invisible.
    image_extra: host at laptop with many browser tabs, overwhelmed
    scripts:
      - >
        Delfín Check-in también es reservas, enlace de pago, microsite y
        reseñas en Google. El huésped te encuentra en Maps y te reserva sin
        la comisión de siempre. Mira los planes en delfincheckin.com
      - >
        Si solo usas el envío al Ministerio, te estás dejando el dinero.
        Página pública, pagos directos y reseñas Google. Más visibilidad y
        más reservas tuyas. Delfín Check-in. Entra en delfincheckin.com

  - id: gestor_caro
    theme: dinero
    money_angle: true
    hook: Tu gestor cobra por cada check-in
    spoken_hook: ¿De verdad pagas por copiar un DNI?
    scene: Propietario mirando factura de gestor, calculadora, ceño.
    image_extra: invoice papers on table, host calculating with phone
    scripts:
      - >
        Haz la cuenta. Delfín Check-in envía al Ministerio por dos euros al
        mes y el huésped rellena solo. Tú dejas de pagar por copiar DNIs.
        Empieza gratis en delfincheckin.com
      - >
        El gestor está bien. Cobrar por teclear un DNI, no. El check-in
        digital de Delfín Check-in lo hace el viajero. El envío al MIR va
        solo. Dos euros al mes. Una propiedad para probar, sin tarjeta.
        delfincheckin.com

  - id: caos_varios_pisos
    theme: tiempo
    money_angle: true
    hook: Cuatro pisos y un Excel que no da más
    spoken_hook: Cuatro pisos y un Excel que no da más.
    scene: Mesa llena de llaves, papeles de varios apartamentos.
    image_extra: several keychains on table, laptop, tired host
    scripts:
      - >
        Delfín Check-in junta reservas, partes y check-in en un solo panel.
        El tiempo que recuperas es para coger más reservas y ganar más.
        Empieza con una propiedad gratis en delfincheckin.com
      - >
        No escalas porque el papeleo te come. Si el parte y el check-in van
        solos, puedes sacar otro anuncio. Delfín Check-in: más pisos, mismo
        lío cero. Entra en delfincheckin.com

  - id: huesped_repite
    theme: dinero
    money_angle: true
    hook: El que ya te conoce sigue pagando comisión
    spoken_hook: El que vuelve te deja otra comisión. Otra vez.
    scene: WhatsApp con un huésped repetidor pidiendo de nuevo el piso.
    image_extra: host looking at phone WhatsApp, bright apartment
    scripts:
      - >
        Le dices que reserve otra vez en Airbnb. Error. Con Delfín Check-in
        le mandas el enlace, te paga en directo y el parte al Ministerio se
        hace igual. Te quedas el margen. delfincheckin.com
      - >
        El repetidor es tu mejor cliente y se lo sigues regalando a la
        plataforma. Página propia, pago directo, check-in digital y el
        parte. Plan Pro de Delfín Check-in, veintinueve noventa y nueve.
        delfincheckin.com

  - id: google_reseñas
    theme: dinero
    money_angle: true
    hook: Te buscan en Google y no sales
    spoken_hook: Te buscan en Google y no existes.
    scene: Búsqueda en el móvil de su piso, solo salen Airbnb y Booking.
    image_extra: host looking at Google Maps on phone, apartment building
    scripts:
      - >
        Solo sale Airbnb. Delfín Check-in Plan Pro pide la reseña en Google
        después del checkout. Te encuentran en Maps, reservan en directo y
        tú te quedas el margen. delfincheckin.com
      - >
        Si no estás en Google, el huésped elige la plataforma y te come la
        comisión. Reseñas automáticas más microsite es más dinero cada mes.
        Delfín Check-in Plan Pro. Entra en delfincheckin.com

  - id: ical_doble
    theme: dinero
    money_angle: true
    hook: Una doble reserva te come el mes
    spoken_hook: Una doble reserva te come el mes entero.
    scene: Calendario con dos reservas el mismo día, estrés.
    image_extra: calendar on laptop with overlapping dates, stressed host
    scripts:
      - >
        Delfín Check-in conecta iCal para bloquear fechas cuando publicas el
        microsite. Reserva directa sin pisar Airbnb, y el parte al
        Ministerio igual. Empieza gratis, una propiedad, en delfincheckin.com
      - >
        Quieres cobro directo y miedo a solapar calendarios. El iCal del
        microsite de Delfín Check-in bloquea fechas con Airbnb y Booking.
        El check-in cubre el MIR. Cobras tú y duermes. Empieza gratis en
        delfincheckin.com

  - id: tiempo_es_dinero
    theme: dinero
    money_angle: true
    hook: El domingo en el Excel no factura
    spoken_hook: El Excel del domingo no te paga el alquiler.
    scene: Reloj de pared, domingo, portátil abierto, playa por la ventana.
    image_extra: Sunday, host at laptop, beach visible through window unused
    scripts:
      - >
        Si el parte y el check-in van solos, publicas más, contestas mejor
        y coges otra reserva. Delfín Check-in te devuelve horas. Y las
        horas son dinero. Empieza gratis en delfincheckin.com
      - >
        No necesitas más horas. Necesitas que el Ministerio y el DNI no te
        las coman. Delfín Check-in. Formulario al huésped, envío al MIR, tú
        a vender el piso. Una propiedad gratis, sin tarjeta, en
        delfincheckin.com

  - id: whatsapp_dni
    theme: tiempo
    money_angle: false
    hook: Otra foto del DNI por WhatsApp
    spoken_hook: Otra foto del DNI por WhatsApp. ¿En serio?
    scene: Propietario de noche con el móvil, captura de un pasaporte borrosa.
    image_extra: host looking at phone with document photo, late evening apartment
    scripts:
      - >
        Te mandan el pasaporte a las tantas y tú lo copias a mano. Con Delfín
        Check-in el huésped rellena el parte en su idioma antes de llegar y
        el Ministerio lo recibe. Una propiedad gratis en delfincheckin.com
      - >
        WhatsApp no es un check-in. Delfín Check-in manda el enlace, el viajero
        lo completa y el envío al MIR va solo. Tú duermes. Empieza gratis,
        sin tarjeta, en delfincheckin.com
