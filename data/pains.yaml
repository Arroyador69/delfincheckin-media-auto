  - id: tiempo_es_dinero
    theme: dinero
    money_angle: true
    hook: El domingo en el Excel no factura
    scene: Reloj de pared, domingo, portátil abierto, playa por la ventana.
    image_extra: Sunday, host at laptop, beach visible through window unused, longing look
    scripts:
      - >
        El domingo en el Excel no factura. Si el parte y el check-in van
