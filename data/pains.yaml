# Solo dolores de propietarios de alojamiento en España + Delfín Check-in.
# Cada pain tiene guiones orales listos (15-30 s). No hay temas genéricos.

pains:
  - id: domingo_dnis
    theme: tiempo
    money_angle: false
    hook: Otro domingo en el portátil
    scene: Propietario en casa un domingo por la mañana, portátil, papeles, cara de no haber salido.
    image_extra: Sunday morning, kitchen table, laptop, printed papers, coffee gone cold, not going to the beach
    scripts:
      - >
        Otro domingo en el portátil. Copiando DNIs. El huésped llega a las once
        y tú sin playa. Con Delfín Check-in el viajero rellena el parte antes
        y se envía solo al Ministerio. Tú recuperas el domingo. Empieza gratis
        en delfincheckin.com
      - >
        Los domingos no son tuyos. Son del Excel y del parte de viajeros.
        Delfín Check-in manda el enlace al huésped, él lo rellena en su idioma
        y el Ministerio lo recibe sin que tú copies nada. Este domingo, sal.
        Una propiedad gratis en delfincheckin.com

  - id: todos_los_dias
    theme: tiempo
    money_angle: false
    hook: No es un mal mes. Es todos los días
    scene: Propietario de noche en el sofá, móvil, check-in a destiempo.
    image_extra: late evening on the sofa with phone, tired host, apartment interior Spain
    scripts:
      - >
        No es un domingo suelto. Es todos los días. Un check-in, un DNI, un
        XML, otro huésped a las once de la noche. Delfín Check-in deja el
        formulario hecho antes de que lleguen. Tú sueltas el móvil. Empieza
        gratis, una propiedad, en delfincheckin.com
      - >
        Te comes el día en mensajes de Airbnb y en el parte. Así no escalas
        ni vives. Con Delfín Check-in el viajero llega con los datos ya
        enviados al Ministerio. Tú gestionas el piso, no copias documentos.
        Empieza gratis en delfincheckin.com

  - id: no_entienden_mir
    theme: legal
    money_angle: false
    hook: Airbnb no te salva del Ministerio
    scene: Propietario confundido mirando el portátil, notificación, ceño.
    image_extra: confused host looking at laptop screen, Spanish apartment, daylight
    scripts:
      - >
        Airbnb no envía el parte de viajeros. Booking tampoco. El Ministerio
        te lo pide a ti, por el RD novecientos treinta y tres. Delfín Check-in
        hace el check-in digital y el envío al MIR por dos euros al mes.
        Una propiedad gratis para empezar. delfincheckin.com
      - >
        Si no sabes qué es el PV y el RH, no eres el único. Son los partes
        al Ministerio y son obligatorios en el piso turístico. Delfín Check-in
        los arma y los manda. Tú no tienes que pelearte con el SES. Entra
        en delfincheckin.com

  - id: huesped_noche
    theme: tiempo
    money_angle: false
    hook: El huésped llega a las once y no tienes el DNI
    scene: Portero automático de noche, propietario en pijama con el teléfono.
    image_extra: night time apartment door, host in hoodie with phone, hallway light
    scripts:
      - >
        El huésped llega a las once. Tú sin el DNI. Sin el parte. Sin ganas.
        Con Delfín Check-in lo rellenó ayer, en su idioma, desde el sofá.
        Tú abres, das la llave y punto. Empieza gratis en delfincheckin.com
      - >
        Check-in de madrugada copiando un pasaporte con el móvil. Basta.
        El enlace de Delfín Check-in se manda en la plantilla de Airbnb.
        Cuando llega, el parte ya está enviado al Ministerio. Tú duermes.
        Una propiedad gratis en delfincheckin.com

