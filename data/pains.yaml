    money_angle: true
    hook: No es que no ganes. Es lo que se te escapa
    scene: Propietario mirando liquidación de Airbnb en el portátil, cara seria.
    image_extra: host looking at payout on laptop, Spanish kitchen, natural light, serious
    scripts:
      - >
        No es que no ganes dinero. Es lo que se te escapa. El huésped que
        vuelve por Airbnb te vuelve a dejar comisión. Con el microsite de
        Delfín Check-in le mandas el enlace y te paga en directo. Más margen.
