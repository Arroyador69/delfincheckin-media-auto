# Dolores de propietarios de alojamiento en España.
# spoken_hook: ~3 s orales (8-12 palabras). scripts: el cuerpo, un tema por vídeo.
# carousel_*: copy del carrusel. NUNCA el hook ni el locutado del Reel.
# Los dos carruseles del día (tiempo vs dinero) llevan títulos distintos.

pains:
  - id: multa_parte
    theme: legal
    money_angle: false
    hook: Si no sale el parte, la multa es tuya
    spoken_hook: Si no sale el parte, la multa te llega a ti.
    carousel_title: El Ministerio te pide el parte a ti, no a Airbnb
    carousel_line: El viajero rellena el check-in. Delfín envía el parte al MIR.
    carousel_caption: >
      El RD 933/2021 obliga a comunicar los huéspedes. Airbnb y Booking no
      lo hacen por ti. Según Interior, no comunicar los datos puede ser
      infracción grave (601 a 30.000 €). En Delfín Check-in el viajero
      rellena antes y el envío va solo. Una propiedad gratis, sin tarjeta.
      delfincheckin.com
    scene: Propietario con el móvil, cara de susto, carta o aviso, piso turístico.
    image_extra: worried host holding phone, Spanish apartment, evening light
    scripts:
      - >
        Airbnb no envía el parte. Si no lo comunicas, Interior puede
        sancionarte. Con Delfín Check-in el huésped rellena en su idioma y
        el envío al Ministerio va solo. Empieza gratis en delfincheckin.com
      - >
        Tienes veinticuatro horas para comunicar el check-in. El Ministerio
        te lo pide a ti. Delfín Check-in arma el parte y lo manda. Tú no
        copias DNIs. Una propiedad gratis, sin tarjeta, en delfincheckin.com

